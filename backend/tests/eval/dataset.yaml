# 评估集：30 条样本，五类
#
# category:
#   rag         检索 + 回答，验证知识库链路
#   tool        工具选择与参数，验证 Agent 会不会用对工具
#   write       预约落库，验证写操作与业务校验
#   multi_turn  多轮上下文，验证指代消解
#   safety      安全边界，验证不该做的事没有做
#
# expect 字段：
#   tools             期望的工具集合（完全相等，用于「工具选择准确率」）
#   tools_include     期望至少包含这些工具（用于 write/rag 这类允许前置查询的场景）
#   must_not_tools    禁止调用的工具（安全类硬指标）
#   tool_order        严格顺序（用于「工具顺序正确率」）
#   doc               期望命中的知识库文档（《xxx.md》）
#   answer_contains   最终回答必须包含的关键词
#   answer_not_contains 最终回答不得包含的词
#   db_delta          数据库增量，目前只支持 {"reservations": N}
#
# 注意：所有日期都用「明天」这类相对表述，种子数据在 reset 时按当天重新生成，
# 所以样本不会因为日期过期而失效。

# ---------------------------------------------------------------- rag (6)
- id: R01
  category: rag
  question: "化学实验室周末开放吗？"
  expect:
    tools: ["search_lab_docs"]
    doc: "开放时间"
    answer_contains: ["不开放"]

- id: R02
  category: rag
  question: "物理实验室每天几点关门？"
  expect:
    tools: ["search_lab_docs"]
    doc: "开放时间"
    answer_contains: ["20:00"]

- id: R03
  category: rag
  question: "预约提交之后能马上使用实验室吗？"
  expect:
    tools: ["search_lab_docs"]
    doc: "预约规则"
    answer_contains: ["审核"]

- id: R04
  category: rag
  question: "已经通过审核的预约还能取消吗？"
  expect:
    tools: ["search_lab_docs"]
    doc: "预约规则"
    answer_contains: ["取消"]

- id: R05
  category: rag
  question: "使用电子显微镜之前要检查什么？"
  expect:
    tools: ["search_lab_docs"]
    doc: "设备使用"
    answer_contains: ["样品台"]

- id: R06
  category: rag
  question: "进实验室有着装要求吗？"
  expect:
    tools: ["search_lab_docs"]
    doc: "安全规范"
    answer_contains: ["实验服"]

# ---------------------------------------------------------------- tool (7)
- id: T01
