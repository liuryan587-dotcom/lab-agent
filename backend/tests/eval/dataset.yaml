    answer_contains: ["化学实验室"]

- id: T03
  category: tool
  question: "人工智能实验室有哪些设备？"
  expect:
    tools: ["list_lab_equipments"]
    answer_contains: ["RTX4090"]

- id: T04
  category: tool
  question: "哪个实验室有显卡？"
  expect:
    tools: ["search_equipments"]
    answer_contains: ["人工智能实验室"]

- id: T05
  category: tool
  question: "今天几号？"
